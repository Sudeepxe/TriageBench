[project]
name = "triagebench"
version = "0.1.0"
description = "Data-efficient model selection for production technical-issue routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "requests>=2.32",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
encoder = [
  "torch>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "datasets>=2.20",
]
llm = [
  "peft>=0.12",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
  "mlx-lm; platform_system == 'Darwin'",
]
plots = [
  "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagebench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

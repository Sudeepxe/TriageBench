# Experiment-wide configuration. The temporal split boundary and long-tail
# policy are filled in and frozen only after reports/phase1_platform.json
# exists — never chosen after seeing model results (see docs/DESIGN_DECISIONS.md).

split:
  strategy: "temporal_within_platform"
  cross_product_transfer: false
  # Frozen 2026-09-10 from the real Creation-time distribution in
  # reports/phase1_platform.json (122,496 Platform rows, span
  # 2001-10-11 to 2022-04-12). Chosen as a clean calendar-year boundary
  # whose measured split ratio (84.81% / 15.19%) already lands almost
  # exactly on the pre-registered 85/15 target -- no finer-grained
  # (sub-year) search was performed to chase a closer match, to avoid
  # even the appearance of tuning the boundary to a desired number.
  # This value must NOT be changed based on any model result.
  boundary_date: "2015-01-01T00:00:00Z"
  measured_split_pct: {older_era: 84.81, recent_era: 15.19}
  target_ratio: {older_era: 0.85, recent_era: 0.15}
  frozen: true
  # Within the older era (train/val/test-in-distribution), decided here
  # BEFORE any model was trained -- standard, unremarkable fractions
  # chosen for their own sake, not tuned against any result. The entire
  # recent era (15.19% of all Platform rows) is test_temporal_shift,
  # untouched by this split. All fractions enforced by
  # triagebench.data.splitting.temporal_split with duplicate-group
  # safety across all four buckets.
  older_era_fractions: {train: 0.70, val: 0.15, test_in_distribution: 0.15}
  split_seed: 0

long_tail_policy:
  # Frozen 2026-09-10 from reports/phase1_platform.json's measured
  # component_taxonomy.counts (21 classes, 122,496 rows), BEFORE any
  # model was trained or any model result existed. Enforced in code by
  # src/triagebench/evaluation/long_tail_policy.py (the single source of
  # truth every arm's evaluation must import) and guarded by
  # tests/test_long_tail_policy.py. Full rationale in
  # reports/class_filtering.json and docs/METHODOLOGY.md. This value
  # must NOT be changed based on any model result.
  minimum_support_threshold: 50
  # "secondary_analysis_only": rare classes are never excluded from the
  # dataset/splits/training and never merged into an Other bucket (the
  # full 21-class taxonomy is preserved everywhere); they are excluded
  # only from the PRIMARY macro-F1 average, and always reported
  # separately (per-class precision/recall/F1) plus counted normally in
  # full micro-F1 and the confusion matrix.
  rare_class_treatment: "secondary_analysis_only"
  decided: true
  primary_classes:
    [UI, SWT, Team, Debug, Releng, Resources, Text, "User Assistance", IDE,
     Ant, CVS, "Update  (deprecated - use Eclipse>Equinox>p2)", Runtime,
     Compare, Search, Doc, Website, Scripting, PMC, WebDAV]
  rare_classes: [Incubator]

data_efficiency_regimes:
  - {examples_per_class: 50}
  - {examples_per_class: 200}
  - {examples_per_class: 1000}
  - {examples_per_class: "full"}

seeds: [0, 1, 2]

statistics:
  bootstrap_resamples: 1000
  confidence_level: 0.95

llm_arms:
  # Frozen 2026-09-11, BEFORE any Arm 2/3/4 prompt was written or any LLM
  # result existed. Generation-based inference (~1.4s/example measured
  # for Qwen2.5-1.5B-Instruct-4bit via MLX on Apple M5) is far slower per
  # example than the classifier-head arms (sub-millisecond), so Arms 2-4
  # evaluate on a fixed-size random subset of each frozen test split
  # rather than the full ~15.6k/18.6k examples -- mirroring the frontier
  # arm's paired-subset methodology, applied locally for the same
  # cost/time reason (here: wall-clock, not API dollars).
  #
  # Sampling is uniform random (seeded), NOT stratified/capped per class,
  # so the subset preserves the real class distribution a production
  # system would actually see -- unlike the *training* regimes, which
  # are deliberately balanced.
  #
  # The SAME subset (by id) is reused across Arms 2, 3, and 4, and Arm
  # 0/1 are also re-scored on it, so all arms are paired/comparable on
  # identical examples. Must not be changed after seeing any LLM result.
  base_model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
  base_model_license: "Apache-2.0 (Qwen2.5) / MLX 4-bit quantization by mlx-community"
  inference_backend: "mlx-lm, local Apple M5, $0 cost"
  eval_subset_size_per_split: 500
  eval_subset_seed: 0
  max_new_tokens: 20
  decoded_label_matching: "case-insensitive exact match against the 21-class taxonomy; anything else counts as an unknown/hallucinated prediction"

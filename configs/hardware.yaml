# Hardware environments used for benchmarking. Filled in with exact specs
# as each environment is actually used (see docs/EXPERIMENT_LOG.md).

environments:
  mac_m5:
    label: "Environment A — Apple Silicon (local)"
    device: "MacBook Pro"
    chip: "Apple M5"
    cpu_cores: 10
    performance_cores: 4
    efficiency_cores: 6
    memory_gb: 16
    memory_type: "LPDDR5 (unified)"
    gpu: "Apple integrated GPU"
    cuda: false
    arch: "arm64"
    notes: >
      Used for development, data inspection, classical ML, preprocessing,
      prompt development, small local inference, and local latency
      benchmarks. No CUDA available; MPS/CPU only.

  cloud_nvidia:
    label: "Environment B — Cloud NVIDIA"
    status: "NOT USED"
    notes: >
      An earlier plan to rent a cloud GPU for Arm 1 was cancelled before any
      instance was provisioned; TriageBench is a $0 external-compute project
      (docs/DESIGN_DECISIONS.md). Every result was produced on Environment A.
      No NVIDIA/CUDA measurement exists anywhere in this repository.
